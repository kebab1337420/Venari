name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-22.04
            label: Linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Electron a besoin de ces bibliotheques pour demarrer. Les tests unitaires
      # mockent `electron`, mais electron-builder embarque un vrai runtime.
      # Aucune bibliotheque runtime n'est necessaire : les tests unitaires
      # mockent `electron` (le runtime n'est donc jamais lance) et
      # electron-builder empaquette sans executer. Le premier essai installait
      # libnotify4/libsecret-1-1/..., ce qui echouait sur le miroir apt
      # restreint du runner ubuntu-22.04 ("Unable to locate package").
      # Seul le trio de compilation reste utile pour npmRebuild, et il est
      # tolerant au cas ou le miroir ne l'expose pas.
      - name: Dependances de build (optionnel)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config \
            || echo "::warning::deps de build indisponibles sur ce miroir (aucun module natif a recompiler)"

      - name: Install
        run: npm ci

      # Node >= 24 bloque les scripts postinstall par defaut : on recupere le
      # binaire Electron explicitement (cf. README, section Installation).
      - name: Binaire Electron
        run: node node_modules/electron/install.js

      - name: Lint + tests + typecheck + build
        run: npm run pack:check

      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.os }}
          path: out/
          retention-days: 7

  package:
    name: package (${{ matrix.label }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            script: dist:win
          - os: ubuntu-22.04
            label: Linux
            script: dist:linux
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Aucune bibliotheque runtime n'est necessaire : les tests unitaires
      # mockent `electron` (le runtime n'est donc jamais lance) et
      # electron-builder empaquette sans executer. Le premier essai installait
      # libnotify4/libsecret-1-1/..., ce qui echouait sur le miroir apt
      # restreint du runner ubuntu-22.04 ("Unable to locate package").
      # Seul le trio de compilation reste utile pour npmRebuild, et il est
      # tolerant au cas ou le miroir ne l'expose pas.
      - name: Dependances de build (optionnel)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config \
            || echo "::warning::deps de build indisponibles sur ce miroir (aucun module natif a recompiler)"

      - run: npm ci

      - name: Binaire Electron
        run: node node_modules/electron/install.js

      # On lance exactement la commande documentee dans le README, afin que la CI
      # verifie le chemin que l'utilisateur suit, pas une variante parallele.
      - name: Empaquetage
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # Tag v* -> attache les artefacts du build a la release GitHub correspondante.
  # Sans ce job, les releases etaient creees vides (exe, blockmap et latest.yml
  # manquants) : c'est ce qu'a constate la release 0.3.0.
  release:
    name: release (artefacts attaches)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Creer la release si elle n'existe pas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --generate-notes --verify-tag

      - name: Attacher setup, blockmap et latest.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f \( \
            -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' -o \
            -name '*.AppImage' -o -name '*.deb' \))
          test ${#files[@]} -gt 0 || { echo "::error::aucun artefact a attacher"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"

  agent:
    name: agent Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Compiler l'agent
        working-directory: remote-agent
        run: cargo build --release

      - run: npm ci

      # L'agent lit son config.json a cote de son executable : le test le copie
      # dans un dossier jetable. Sans ce build, le test serait ignore en silence.
      - name: Test de bout en bout de l'agent
        run: npx vitest run tests/agent-rust.test.ts

  agent-windows-only:
    name: agent Rust refuse de compiler hors Windows
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Le README affirme que l'agent est Windows uniquement. Plutot que de
      # laisser cette phrase se degrader dans la doc, on verifie l'invariant :
      # le build Linux doit echouer sur le compile_error! volontaire.
      - name: Le build Linux doit echouer explicitement
        working-directory: remote-agent
        run: |
          set +e
          cargo check --release 2>&1 | tee /tmp/agent-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::l'agent distant compile sous Linux alors que la doc annonce Windows uniquement"
            exit 1
          fi
          if ! grep -q "compile_error\|Windows uniquement" /tmp/agent-check.log; then
            echo "::error::le build Linux echoue sans le message explicite attendu"
            cat /tmp/agent-check.log
            exit 1
          fi
          echo "invariant respecte : build Linux refuse avec un message explicite"

  # Les jobs package prouvent que les artefacts se construisent. Ceux-ci prouvent
  # qu'ils se demarrent : c'etait le dernier maillon non couvert.
  # On ne verifie pas le port 8787 : le serveur MCP ne demarre que si la config
  # contient un jeton chiffre, qu'on ne peut pas forger depuis l'exterieur.
  # On verifie donc que le processus Electron tient, pas qu'il ecoute.
  smoke-linux:
    name: smoke (AppImage demarre)
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu-22.04
          path: dist

      # Chaque paquet est installe independamment : le miroir apt de ce runner
      # n'expose pas tous les paquets, et c'est le lancement de l'app qui doit
      # decide si une bibliotheque manquante est un vrai probleme. Un echec
      # ici doit donc produire un avertissement, pas un job rouge.
      - name: Dependances d'execution
        run: |
          sudo apt-get update
          for pkg in xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2 \
                     libsecret-1-1 libnotify4 libxtst6; do
            if sudo apt-get install -y --no-install-recommends "$pkg" >/dev/null 2>&1; then
              echo "installe : $pkg"
            else
              echo "::warning::paquet indisponible sur ce runner : $pkg"
            fi
          done

      # --appimage-extract evite FUSE, absent ou empirique sur les runners.
      - name: Extraire l'AppImage
        run: |
          chmod +x dist/*.AppImage
          ./dist/*.AppImage --appimage-extract
          test -x squashfs-root/AppRun || { echo "::error::AppRun introuvable"; exit 1; }
          ls squashfs-root

      - name: Lancer et verifier que le processus tient
        run: |
          set -e
          timeout 60 xvfb-run -a ./squashfs-root/AppRun --no-sandbox --disable-gpu \
            > /tmp/app.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::l'AppImage a quitte apres ${i}s"
              cat /tmp/app.log
              exit 1
            fi
          done
          echo "::notice::AppImage vivante apres 30s (pid $pid)"
          cat /tmp/app.log || true
          kill "$pid" 2>/dev/null || true

  smoke-windows:
    name: smoke (installeur NSIS + lancement)
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-windows-latest
          path: dist

      # Meme sequence que la validation locale : installateur silencieux, puis
      # verification que l'executable a bien ete pose.
      - name: Installation silencieuse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Wildcard : le nom porte la version de package.json, qui change a chaque release.
          $setup = (Resolve-Path 'dist\Venari-Setup-*.exe' | Select-Object -First 1).Path
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installateur sorti en $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Venari\Venari.exe'
          if (-not (Test-Path $exe)) { throw "executable absent apres installation : $exe" }
          "installee : $exe"

      - name: Lancer et verifier que le processus tient
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Venari\Venari.exe'
          $proc = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 25
          if ($proc.HasExited) { throw "l'app a quitte (code $($proc.ExitCode))" }
          "::notice::application vivante, PID $($proc.Id)"
          Get-Process -Id $proc.Id | Select-Object Id, ProcessName
          Stop-Process -Id $proc.Id -Force

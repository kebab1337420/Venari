[package]
name = "bountydesk-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jpeg-encoder = "0.7"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1